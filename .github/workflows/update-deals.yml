name: Atualizar Ofertas e Publicar no GitHub Pages

on:
  schedule:
    # Roda 4x ao dia (UTC)
    - cron: '0 11 * * *'  # 08:00 BRT
    - cron: '0 15 * * *'  # 12:00 BRT
    - cron: '0 19 * * *'  # 16:00 BRT
    - cron: '0 23 * * *'  # 20:00 BRT
  workflow_dispatch: # Permite rodar manualmente pelo painel do GitHub

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Scrapers e Exportar JSON
        run: |
          python -c "from services.scrapers import run_all_scrapers; run_all_scrapers()"

      - name: Commit e Push das Novas Ofertas
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/deals.json promotions_history.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): atualizar ofertas e histórico [skip ci]" && git push)
